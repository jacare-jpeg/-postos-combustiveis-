<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preços de Combustíveis</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    color: #222;
    background: #fff;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitulo {
    color: #666;
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .controles {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .controles input, .controles select {
    padding: 6px 8px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
    font-family: inherit;
  }
  .controles input {
    flex: 1;
  }
  .dica {
    color: #999;
    font-size: 0.75rem;
    margin: 0 0 10px;
  }
  .contagem {
    color: #666;
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    padding: 8px;
    border-bottom: 2px solid #222;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #444;
    position: sticky;
    top: 0;
    background: #fff;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover {
    color: #000;
  }
  thead th .seta {
    color: #999;
    font-size: 0.75em;
    margin-left: 3px;
  }
  thead th.ativo .seta {
    color: #222;
  }
  tbody td {
    padding: 7px 8px;
    border-bottom: 1px solid #e0e0e0;
    vertical-align: top;
  }
  tbody tr:hover {
    background: #f7f7f7;
  }
  .preco {
    font-weight: 600;
    white-space: nowrap;
  }
  .data {
    color: #888;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .sem-resultado {
    text-align: center;
    color: #888;
    padding: 24px 0;
  }
  .grupo-cabecalho td {
    background: #f0f0f0;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #333;
    padding: 6px 8px;
    border-bottom: 1px solid #ddd;
    border-top: 1px solid #ddd;
  }
  .grupo-cabecalho .qtd {
    font-weight: 400;
    text-transform: none;
    color: #888;
    letter-spacing: normal;
    margin-left: 6px;
  }
  th.col-preco, td.col-preco { text-align: right; }

  .grafico-wrap {
    border: 1px solid #e0e0e0;
    padding: 16px;
    height: 320px;
  }
  .grafico-wrap canvas {
    max-height: 100%;
  }

  .abas {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #ddd;
    margin-bottom: 18px;
  }
  .abas button {
    font-family: inherit;
    font-size: 0.9rem;
    background: none;
    border: none;
    padding: 10px 4px;
    margin-right: 20px;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .abas button:hover {
    color: #333;
  }
  .abas button.ativa {
    color: #111;
    font-weight: 600;
    border-bottom-color: #111;
  }
  .painel {
    display: none;
  }
  .painel.ativa {
    display: block;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Preços de Combustíveis</h1>
  <p class="subtitulo">Vila Velha/ES</p>

  <div class="abas">
    <button class="ativa" data-painel="painelTabela">Tabela</button>
    <button data-painel="painelMedias">Preço médio por combustível</button>
    <button data-painel="painelPosto">Preço por posto</button>
  </div>

  <div class="painel ativa" id="painelTabela">
    <div class="controles">
      <input type="text" id="busca" placeholder="Buscar posto, rua ou bairro...">
      <select id="filtroCombustivel">
        <option value="">Todos os combustíveis</option>
      </select>
    </div>
    <p class="dica">Clique no cabeçalho de uma coluna para ordenar.</p>

    <div class="contagem" id="contagem"></div>

    <table>
      <thead>
        <tr>
          <th data-campo="posto">Posto <span class="seta"></span></th>
          <th data-campo="bairro">Endereço <span class="seta"></span></th>
          <th data-campo="produto">Combustível <span class="seta"></span></th>
          <th class="col-preco" data-campo="preco">Preço <span class="seta"></span></th>
          <th data-campo="dataOrd">Coleta <span class="seta"></span></th>
        </tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
  </div>

  <div class="painel" id="painelMedias">
    <p class="subtitulo">Média entre todos os postos, por data de coleta</p>
    <div class="grafico-wrap">
      <canvas id="graficoMedias"></canvas>
    </div>
  </div>

  <div class="painel" id="painelPosto">
    <p class="subtitulo">Escolha um posto para ver o histórico de cada combustível</p>
    <div class="controles">
      <select id="seletorPosto"></select>
    </div>
    <div class="grafico-wrap">
      <canvas id="graficoPosto"></canvas>
    </div>
  </div>
</div>

// navegação por abas
const botoesAba = document.querySelectorAll('.abas button');
const paineis = document.querySelectorAll('.painel');
let graficosRenderizados = { medias: false, posto: false };

botoesAba.forEach(btn => {
  btn.addEventListener('click', () => {
    botoesAba.forEach(b => b.classList.remove('ativa'));
    paineis.forEach(p => p.classList.remove('ativa'));
    btn.classList.add('ativa');
    document.getElementById(btn.dataset.painel).classList.add('ativa');

    if (btn.dataset.painel === 'painelMedias' && !graficosRenderizados.medias) {
      renderGraficoMedias();
      graficosRenderizados.medias = true;
    }
    if (btn.dataset.painel === 'painelPosto' && !graficosRenderizados.posto) {
      renderGraficoPosto();
      graficosRenderizados.posto = true;
    }
  });
});

const corpo = document.getElementById('corpo');
const busca = document.getElementById('busca');
const filtroCombustivel = document.getElementById('filtroCombustivel');
const contagem = document.getElementById('contagem');
const cabecalhos = document.querySelectorAll('thead th[data-campo]');

function nomeProduto(produto) {
  return produto.charAt(0) + produto.slice(1).toLowerCase();
}

function dataParaOrdenar(data) {
  const partes = data.split('/');
  return partes[2] + '-' + partes[1] + '-' + partes[0];
}

const registros = [];

POSTOS_DATA.forEach(posto => {
  const endereco = [posto.rua, posto.numero]
    .filter(v => v && v !== 'S/N')
    .join(', ') + ' — ' + posto.bairro + ', ' + posto.municipio;

  posto.combustiveis.forEach(combustivel => {
    registros.push({
      posto: posto.nome,
      endereco: endereco,
      bairro: posto.bairro,
      produto: combustivel.produto,
      preco: combustivel.preco,
      data: combustivel.data,
      dataOrd: dataParaOrdenar(combustivel.data)
    });
  });
});

let ordem = 'posto';
let direcao = 1;

const combustiveis = [];

registros.forEach(registro => {
  if (!combustiveis.includes(registro.produto)) {
    combustiveis.push(registro.produto);
  }
});

combustiveis.sort();

combustiveis.forEach(produto => {
  const opcao = document.createElement('option');
  opcao.value = produto;
  opcao.textContent = nomeProduto(produto);
  filtroCombustivel.appendChild(opcao);
});

function atualizarSetas() {
  cabecalhos.forEach(th => {
    const seta = th.querySelector('.seta');

    if (th.dataset.campo === ordem) {
      th.classList.add('ativo');
      seta.textContent = direcao === 1 ? '▲' : '▼';
    } else {
      th.classList.remove('ativo');
      seta.textContent = '';
    }
  });
}

function mostrarTabela() {
  const termo = busca.value.trim().toLowerCase();
  const combustivelEscolhido = filtroCombustivel.value;

  let filtrados = registros.filter(registro => {
    const texto = (registro.posto + ' ' + registro.endereco).toLowerCase();

    return texto.includes(termo) &&
      (!combustivelEscolhido || registro.produto === combustivelEscolhido);
  });

  // quando ordenar por preço, separa os combustíveis
  const separarCombustiveis =
    ordem === 'preco' && !combustivelEscolhido;

  filtrados.sort((a, b) => {
    if (separarCombustiveis && a.produto !== b.produto) {
      return a.produto.localeCompare(b.produto);
    }

    const valorA = a[ordem];
    const valorB = b[ordem];

    if (typeof valorA === 'number') {
      return (valorA - valorB) * direcao;
    }

    return valorA.localeCompare(valorB) * direcao;
  });

  atualizarSetas();

  contagem.textContent =
    filtrados.length + ' de ' + registros.length + ' registros';

  if (filtrados.length === 0) {
    corpo.innerHTML =
      '<tr><td colspan="5" class="sem-resultado">Nenhum resultado encontrado.</td></tr>';
    return;
  }

  const contagemPorProduto = {};

  filtrados.forEach(registro => {
    contagemPorProduto[registro.produto] =
      (contagemPorProduto[registro.produto] || 0) + 1;
  });

  let html = '';
  let grupoAtual = '';

  filtrados.forEach(registro => {
    if (separarCombustiveis && registro.produto !== grupoAtual) {
      grupoAtual = registro.produto;

      const quantidade = contagemPorProduto[grupoAtual];
      const nome = nomeProduto(grupoAtual);

      html += '<tr class="grupo-cabecalho">' +
        '<td colspan="5">' + nome +
        '<span class="qtd">' + quantidade +
        ' posto' + (quantidade > 1 ? 's' : '') +
        '</span></td></tr>';
    }

    const nomeCombustivel = nomeProduto(registro.produto);

    html += '<tr>' +
      '<td>' + registro.posto + '</td>' +
      '<td>' + registro.endereco + '</td>' +
      '<td>' + nomeCombustivel + '</td>' +
      '<td class="col-preco preco">R$ ' +
        registro.preco.toFixed(2).replace('.', ',') + '</td>' +
      '<td class="data">' + registro.data + '</td>' +
      '</tr>';
  });

  corpo.innerHTML = html;
}

cabecalhos.forEach(th => {
  th.addEventListener('click', () => {
    const campo = th.dataset.campo;

    if (ordem === campo) {
      direcao *= -1;
    } else {
      ordem = campo;
      direcao = 1;
    }

    mostrarTabela();
  });
});

busca.addEventListener('input', mostrarTabela);
filtroCombustivel.addEventListener('change', mostrarTabela);

mostrarTabela();

const CORES_COMBUSTIVEL = {
  'GASOLINA': '#2f6f97',
  'GASOLINA ADITIVADA': '#c78a2e',
  'ETANOL': '#3f8b52',
  'DIESEL': '#a33d3d',
  'DIESEL S10': '#4f8f89',
  'GNV': '#7a6a52'
};

function nomesDeProdutos(dadosPorProduto) {
  return Object.keys(dadosPorProduto).sort();
}

// monta { labels, datasets } no formato que o Chart.js espera,
// juntando as datas de todos os combustíveis num único eixo X
function montarDadosDoGrafico(dadosPorProduto) {
  const produtos = nomesDeProdutos(dadosPorProduto);

  const todasAsDatas = new Set();
  produtos.forEach(produto => {
    dadosPorProduto[produto].forEach(item => todasAsDatas.add(item.data));
  });
  const labels = [...todasAsDatas].sort();

  const datasets = produtos.map(produto => {
    const precoPorData = {};
    dadosPorProduto[produto].forEach(item => {
      precoPorData[item.data] = item.preco;
    });

    return {
      label: nomeProduto(produto),
      data: labels.map(data => precoPorData[data] ?? null),
      borderColor: CORES_COMBUSTIVEL[produto] || '#888',
      backgroundColor: CORES_COMBUSTIVEL[produto] || '#888',
      spanGaps: true,
      tension: 0.15,
      borderWidth: 2,
      pointRadius: 2
    };
  });

  return { labels, datasets };
}

function formatarDataTick(dataIso) {
  const [ano, mes, dia] = dataIso.split('-');
  return dia + '/' + mes;
}

const opcoesDoGrafico = {
  responsive: true,
  maintainAspectRatio: false,
  interaction: { mode: 'nearest', intersect: false },
  scales: {
    x: {
      ticks: {
        autoSkip: true,
        maxRotation: 0,
        callback: function (valor) {
          return formatarDataTick(this.getLabelForValue(valor));
        }
      },
      grid: { display: false }
    },
    y: {
      ticks: {
        callback: valor => 'R$ ' + valor.toFixed(2).replace('.', ',')
      },
      grid: { color: '#eee' }
    }
  },
  plugins: {
    legend: {
      position: 'top',
      labels: { boxWidth: 10, font: { size: 11 } }
    },
    tooltip: {
      callbacks: {
        label: contexto =>
          contexto.dataset.label + ': R$ ' +
          contexto.parsed.y.toFixed(2).replace('.', ',')
      }
    }
  }
};

// gráfico de média por combustível
let graficoMedias = null;

function renderGraficoMedias() {
  const { labels, datasets } = montarDadosDoGrafico(MEDIAS_COMBUSTIVEL);

  if (graficoMedias) {
    graficoMedias.destroy();
  }

  graficoMedias = new Chart(document.getElementById('graficoMedias'), {
    type: 'line',
    data: { labels, datasets },
    options: opcoesDoGrafico
  });
}

// gráfico de histórico por posto
const seletorPosto = document.getElementById('seletorPosto');
const postosOrdenados = Object.keys(HISTORICO_POSTOS).sort();

postosOrdenados.forEach(nome => {
  const opcao = document.createElement('option');
  opcao.value = nome;
  opcao.textContent = nome;
  seletorPosto.appendChild(opcao);
});

if (postosOrdenados.length > 0) {
  seletorPosto.value = postosOrdenados[0];
}

let graficoPosto = null;

function renderGraficoPosto() {
  const posto = seletorPosto.value;
  const dadosPosto = HISTORICO_POSTOS[posto] || {};
  const { labels, datasets } = montarDadosDoGrafico(dadosPosto);

  if (graficoPosto) {
    graficoPosto.destroy();
  }

  graficoPosto = new Chart(document.getElementById('graficoPosto'), {
    type: 'line',
    data: { labels, datasets },
    options: opcoesDoGrafico
  });
}

seletorPosto.addEventListener('change', renderGraficoPosto);

</script>
